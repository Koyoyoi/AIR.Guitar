<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.4/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
    <title>AIR Guitar</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" href="./visual/kaf_icon.png">
</head>

<body>
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="toolbar">
        <div id="modeControl">
            <span id="modeValue">${mode[0]}</span>
            <span id="modeSeparator"></span>
            <button id="switchMode" title="Switch Mode">
                <i class="fa-solid fa-repeat"></i>
            </button>
        </div>

        <div class="capo-control">
            <button id="capoMinus" title="Decrease Capo">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span id="capoValue">Capo 0</span>
            <button id="capoPlus" title="Increase Capo">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div id="midiList">
            <button id="midiPrev">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <span id="midiName">MIDI</span>

            <button id="midiNext">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>

</html>
